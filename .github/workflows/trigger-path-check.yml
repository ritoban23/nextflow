name: Trigger Path Checks

on:
  pull_request:
    paths:
      - "src/trigger/**"
      - "trigger.config.ts"
      - "app/api/runs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
